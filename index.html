.w{max-width:520px;margin:0 auto;padding:16px 14px 44px}
h1{margin:8px 4px 2px;font-size:30px;letter-spacing:.2px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.sub{color:#d6cfc5;font-size:15px;margin:0 4px 16px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.card{position:relative;background:linear-gradient(160deg,rgba(128,132,138,.30),rgba(66,68,74,.36));backdrop-filter:blur(28px) saturate(1.05);-webkit-backdrop-filter:blur(28px) saturate(1.05);border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:16px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 28px rgba(0,0,0,.45)}
.lab{font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mut);margin:0 2px 10px;font-weight:600}
.seg{display:flex;background:rgba(0,0,0,.4);border-radius:999px;padding:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.seg button{flex:1;border:0;background:none;color:var(--tx);font-family:inherit;font-weight:600;font-size:19px;padding:12px;border-radius:999px}
.seg button.on{background:linear-gradient(180deg,#b8262f,#7c1520);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 9px rgba(0,0,0,.4);color:#fff}
.dia,.row{display:flex;align-items:center;gap:10px}
.row{margin-bottom:10px}.row:last-child{margin-bottom:0}
.row label{width:128px;color:var(--mut);font-size:17px}
.row span,.dia span{color:var(--mut);font-size:16px;width:34px}
.dia span{width:auto;font-size:18px}
input{flex:1;min-width:0;font-family:inherit;font-weight:700;color:var(--tx);background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:10px 14px;outline:0;box-shadow:inset 0 3px 9px rgba(0,0,0,.65)}
.row input{font-size:26px;text-align:right}.dia input{font-size:30px}
input::placeholder{color:rgba(255,255,255,.28)}
input:focus{border-color:#d4505c;box-shadow:inset 0 3px 9px rgba(0,0,0,.65),0 0 0 3px rgba(212,80,92,.3)}
.hint{font-size:15px;color:var(--mut);margin:8px 4px 0;min-height:18px}.hint.err{color:#ff9d9d}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-width:48px;border:1px solid rgba(255,255,255,.15);background:rgba(150,154,160,.24);color:var(--tx);font-family:inherit;font-weight:600;font-size:18px;padding:10px 14px;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.chip.on{background:linear-gradient(180deg,#b8262f,#7c1520);border-color:rgba(255,140,150,.55);color:#fff}
.chip.dis{opacity:.28}
.sel{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}.sel b{font-size:40px;color:#fff}.sel i{font-style:normal;color:var(--mut);font-size:15px}
.sp{height:14px}
.res .big{background:linear-gradient(150deg,rgba(190,40,55,.55),rgba(110,16,28,.42));border:1px solid rgba(255,130,140,.55);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.res .big .v{font-size:36px;font-weight:800;line-height:1.15}.res .big .d{font-size:20px;color:#ffdede;margin-top:2px}
.st{border-radius:22px;padding:16px;margin-bottom:14px;text-align:center;border:1px solid rgba(255,255,255,.3)}
.st.bad{background:linear-gradient(150deg,#ff4a4a,#d4122c);color:#fff;border-color:rgba(255,200,200,.85);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 0 26px rgba(255,60,60,.5)}
.st.ok{background:linear-gradient(150deg,#2cf08a,#0db55c);color:#032014;border-color:rgba(200,255,225,.95);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 0 26px rgba(40,235,130,.5)}
.st.idle{background:rgba(255,255,255,.08);color:var(--mut)}
.st .h{font-size:17px;font-weight:600}.st .v{font-size:44px;font-weight:800;line-height:1.15}.st .u{font-size:17px;opacity:.92}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.c{background:rgba(150,154,160,.20);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.c .t{font-size:14px;color:var(--mut)}.c .v{font-size:23px;font-weight:700;margin-top:2px}.c .u{font-size:15px;color:var(--mut)}
.g3 .c{padding:9px 8px}.g3 .c .v{font-size:20px}
.foot{color:#d6cfc5;font-size:13px;text-align:center;margin-top:16px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
</style>
</head>

<p class="lab">Радиусы кривизны</p>
<div class="row"><label for="rs">Заданный</label><input id="rs" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
<div class="row"><label for="ri">Фактический</label><input id="ri" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
</div>

<div class="card">
<p class="lab">Контрольный диаметр</p>
<div class="row"><label for="dd">Диаметр</label><input id="dd" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
</div>

<div class="card" id="res"></div>

<div class="card">
<p class="lab">Допуск на радиус</p>
<div class="row"><div class="seg" id="tm" style="width:120px"><button data-v="p">%</button><button data-v="m">мм</button></div><input id="tv" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"></div>
</div>
<div class="foot">Стрелка прогиба: s = R − √(R² − D²/4). Коррекция = (k2 − k1) · 1000 мкм.</div>
</div>

<script>
var S={f:'x',tm:'p',tp:'1,000',tmm:'0,000',rs:'',ri:'',dd:''};
try{var sv=JSON.parse(localStorage.getItem('korr')||'null');if(sv&&sv.f)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem('korr',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function num(s){var v=parseFloat(String(s).replace(',','.'));return v}
function f3(x,sign){var r=Math.round(x*1000)/1000;if(r===0)r=0;var s=Math.abs(r).toFixed(3).replace('.',',');return (sign?(r>0?'+':r<0?'−':''):(r<0?'−':''))+s}
function seg(id,key){var b=$(id).children;for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.v==S[key]?'on':''}
function calc(){
  var rs=num(S.rs),ri=num(S.ri),d=num(S.dd),t=num(S.tm=='p'?S.tp:S.tmm);if(isNaN(t))t=0;
  var msg=null;
  if(!(rs>0))msg='Введите заданный радиус';
  else if(!(ri>0))msg='Введите фактический радиус';
  else if(!(d>0))msg='Введите контрольный диаметр';
  else if(d/2>rs||d/2>ri)msg='Контрольный диаметр не может быть больше 2R';
  if(msg)return {msg:msg};
  var sag=function(R){return R-Math.sqrt(R*R-d*d/4)},sg=S.f=='x'?1:-1;
  var k1=sg*sag(rs),k2=sg*sag(ri),corr=(k2-k1)*1000;
  var tol=S.tm=='p'?rs*t/100:t,mn,mx;
  if(S.f=='x'){mn=rs;mx=rs+tol}else{mn=rs-tol;mx=rs}
  return {k1:k1,k2:k2,corr:corr,mn:mn,mx:mx,md:(mn+mx)/2,bad:ri<mn||ri>mx};
}
function out(){
  var c=calc(),r=$('res');
  if(c.msg){r.innerHTML='<div class="st idle"><div class="h">'+c.msg+'</div></div>';return}
  r.innerHTML='<p class="lab">Величина коррекции</p>'+
  '<div class="st '+(c.bad?'bad':'ok')+'"><div class="h">'+(c.bad?'Введите коррекцию в станок':'Радиус в допуске')+'</div><div class="v">'+f3(c.corr,1)+'</div><div class="u">мкм'+(c.bad?'':' · коррекция не нужна')+'</div></div>'+
  '<p class="lab">Диапазон радиусов кривизны, мм</p>'+
  '<div class="g3"><div class="c"><div class="t">R мин.</div><div class="v">'+f3(c.mn)+'</div></div><div class="c"><div class="t">R средн.</div><div class="v">'+f3(c.md)+'</div></div><div class="c"><div class="t">R макс.</div><div class="v">'+f3(c.mx)+'</div></div></div>'+
  '<div style="height:12px"></div><p class="lab">Стрелки прогиба, мм</p>'+
  '<div class="g"><div class="c"><div class="t">k1 (заданный)</div><div class="v">'+f3(c.k1)+'</div></div><div class="c"><div class="t">k2 (фактический)</div><div class="v">'+f3(c.k2)+'</div></div></div>';
}
function ui(){seg('form','f');seg('tm','tm');$('rs').value=S.rs;$('ri').value=S.ri;$('dd').value=S.dd;$('tv').value=S.tm=='p'?S.tp:S.tmm;out()}
function bind(id,key){$(id).oninput=function(){var v=this.value.replace(/[^0-9.,]/g,'').replace('.',',');if(this.value!=v)this.value=v;S[key]=v;save();out()}}
bind('rs','rs');bind('ri','ri');bind('dd','dd');
$('tv').oninput=function(){var v=this.value.replace(/[^0-9.,]/g,'').replace('.',',');if(this.value!=v)this.value=v;S[S.tm=='p'?'tp':'tmm']=v;save();out()};
$('form').onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){S.f=v;save();ui()}};
$('tm').onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){S.tm=v;save();ui()}};
ui();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
