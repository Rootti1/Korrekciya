.w{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{margin:6px 0 2px;font-size:26px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:0 0 8px}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--tx);font-family:inherit;font-weight:600;font-size:17px;padding:12px;border-radius:10px}
.seg button.on{background:linear-gradient(var(--red),var(--red2));box-shadow:0 2px 8px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row label{width:112px;color:var(--mut);font-size:15px}
.row input{flex:1;min-width:0;font-family:inherit;font-weight:700;font-size:24px;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:0;text-align:right}
.row input:focus{border-color:var(--red)}
.row span{width:30px;color:var(--mut);font-size:14px}
.st{border-radius:14px;padding:14px;margin-bottom:10px;text-align:center}
.st.bad{background:linear-gradient(135deg,var(--red),var(--red2))}
.st.ok{background:linear-gradient(135deg,var(--ok),var(--ok2))}
.st.idle{background:rgba(255,255,255,.07);color:var(--mut)}
.st .h{font-size:15px;font-weight:600}
.st .v{font-size:40px;font-weight:800;line-height:1.15}
.st .u{font-size:15px;opacity:.9}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.c{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px}
.c .t{font-size:12px;color:var(--mut)}
.c .v{font-size:20px;font-weight:700;margin-top:1px}
.c.hl{outline:2px solid var(--red)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="w">
<h1>Коррекция радиуса</h1>
<div class="sub">Расчет по стрелке прогиба · SM 50/100 CNC · OptoTech</div>

<div class="card">
<p class="lab">Форма поверхности</p>
<div class="seg" id="form"><button data-v="x">Выпуклая</button><button data-v="v">Вогнутая</button></div>
</div>

<div class="card">
<p class="lab">Радиусы кривизны</p>
<div class="row"><label for="rs">Заданный</label><input id="rs" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
<div class="row"><label for="ri">Фактический</label><input id="ri" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
<div class="row"><label for="dd">Контрольный диаметр</label><input id="dd" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"><span>мм</span></div>
</div>

<div class="card">
<p class="lab">Допуск на радиус</p>
<div class="row"><div class="seg" id="tm" style="width:120px"><button data-v="p">%</button><button data-v="m">мм</button></div><input id="tv" type="text" inputmode="decimal" autocomplete="off" placeholder="0,000"></div>
</div>

<div class="card" id="res"></div>
<div class="foot">Стрелка прогиба: s = R − √(R² − D²/4). Коррекция = (k2 − k1) · 1000 мкм.</div>
</div>

<script>
var S={f:'x',tm:'p',tp:'1,000',tmm:'0,000',rs:'',ri:'',dd:''};
try{var sv=JSON.parse(localStorage.getItem('korr')||'null');if(sv&&sv.f)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem('korr',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function num(s){var v=parseFloat(String(s).replace(',','.'));return v}
function f3(x,sign){var r=Math.round(x*1000)/1000;if(r===0)r=0;var s=Math.abs(r).toFixed(3).replace('.',',');return (sign?(r>0?'+':r<0?'−':''):(r<0?'−':''))+s}
function seg(id,key){var b=$(id).children;for(var i=0;i<b.length;i++)b[i].className=b[i].dataset.v==S[key]?'on':''}
function calc(){
  var rs=num(S.rs),ri=num(S.ri),d=num(S.dd),t=num(S.tm=='p'?S.tp:S.tmm);if(isNaN(t))t=0;
  var msg=null;
  if(!(rs>0))msg='Введите заданный радиус';
  else if(!(ri>0))msg='Введите фактический радиус';
  else if(!(d>0))msg='Введите контрольный диаметр';
  else if(d/2>rs||d/2>ri)msg='Контрольный диаметр не может быть больше 2R';
  if(msg)return {msg:msg};
  var sag=function(R){return R-Math.sqrt(R*R-d*d/4)},sg=S.f=='x'?1:-1;
  var k1=sg*sag(rs),k2=sg*sag(ri),corr=(k2-k1)*1000;
  var tol=S.tm=='p'?rs*t/100:t,mn,mx;
  if(S.f=='x'){mn=rs;mx=rs+tol}else{mn=rs-tol;mx=rs}
  return {k1:k1,k2:k2,corr:corr,mn:mn,mx:mx,md:(mn+mx)/2,bad:ri<mn||ri>mx};
}
function out(){
  var c=calc(),r=$('res');
  if(c.msg){r.innerHTML='<div class="st idle"><div class="h">'+c.msg+'</div></div>';return}
  r.innerHTML='<p class="lab">Величина коррекции</p>'+
  '<div class="st '+(c.bad?'bad':'ok')+'"><div class="h">'+(c.bad?'Введите коррекцию в станок':'Радиус в допуске')+'</div><div class="v">'+f3(c.corr,1)+'</div><div class="u">мкм'+(c.bad?'':' · коррекция не нужна')+'</div></div>'+
  '<p class="lab">Диапазон радиусов кривизны, мм</p>'+
  '<div class="g3"><div class="c"><div class="t">R мин.</div><div class="v">'+f3(c.mn)+'</div></div><div class="c"><div class="t">R средн.</div><div class="v">'+f3(c.md)+'</div></div><div class="c"><div class="t">R макс.</div><div class="v">'+f3(c.mx)+'</div></div></div>'+
  '<div style="height:12px"></div><p class="lab">Стрелки прогиба, мм</p>'+
  '<div class="g"><div class="c"><div class="t">k1 (заданный)</div><div class="v">'+f3(c.k1)+'</div></div><div class="c"><div class="t">k2 (фактический)</div><div class="v">'+f3(c.k2)+'</div></div></div>';
}
function ui(){seg('form','f');seg('tm','tm');$('rs').value=S.rs;$('ri').value=S.ri;$('dd').value=S.dd;$('tv').value=S.tm=='p'?S.tp:S.tmm;out()}
function bind(id,key){$(id).oninput=function(){var v=this.value.replace(/[^0-9.,]/g,'').replace('.',',');if(this.value!=v)this.value=v;S[key]=v;save();out()}}
bind('rs','rs');bind('ri','ri');bind('dd','dd');
$('tv').oninput=function(){var v=this.value.replace(/[^0-9.,]/g,'').replace('.',',');if(this.value!=v)this.value=v;S[S.tm=='p'?'tp':'tmm']=v;save();out()};
$('form').onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){S.f=v;save();ui()}};
$('tm').onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){S.tm=v;save();ui()}};
ui();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
